name: Build and verify Courseflow
description: Build locked sources, exercise module contracts, and test deployment recovery.
inputs:
  version:
    description: Image version
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.13'
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
    - name: Offline image lock portability
      shell: bash
      run: python3 tests/offline-load.py
    - name: Export pinned sources
      shell: bash
      run: python3 build/prepare.py
    - id: args
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        python3 - <<'PY' >> "$GITHUB_OUTPUT"
        import json,os
        lock=json.load(open('sources.lock.json'))
        print('args<<BUILD_ARGS')
        for key,value in lock['base_images'].items(): print(key.upper()+'_IMAGE='+value)
        for key,value in lock['components'].items(): print(key.upper()+'_REVISION='+value['commit'])
        print('RELEASE_VERSION='+os.environ['VERSION'])
        print('BUILD_ARGS')
        PY
    - name: Backend type checks and all offline contracts (zero skips)
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
      with:
        context: .build/context
        file: .build/context/api.Dockerfile
        target: test
        platforms: linux/amd64
        build-args: ${{ steps.args.outputs.args }}
        cache-from: |
          type=gha,scope=api-test
          type=gha,scope=api
        cache-to: type=gha,scope=api-test,mode=max
    - name: API runtime
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
      with:
        context: .build/context
        file: .build/context/api.Dockerfile
        target: runtime
        platforms: linux/amd64
        load: true
        tags: courseflow-api:${{ inputs.version }}
        build-args: ${{ steps.args.outputs.args }}
        cache-from: |
          type=gha,scope=api-test
          type=gha,scope=api
        cache-to: type=gha,scope=api,mode=max
    - name: WebUI checks, tests and production build
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
      with:
        context: .build/context
        file: .build/context/web.Dockerfile
        platforms: linux/amd64
        load: true
        tags: courseflow-webui:${{ inputs.version }}
        build-args: ${{ steps.args.outputs.args }}
        cache-from: type=gha,scope=web
        cache-to: type=gha,scope=web,mode=max
    - name: Deployment and recovery acceptance
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        printf 'API_IMAGE=courseflow-api:%s\nWEB_IMAGE=courseflow-webui:%s\n' "$VERSION" "$VERSION" > .build/images.lock.env
        python3 tests/smoke.py
