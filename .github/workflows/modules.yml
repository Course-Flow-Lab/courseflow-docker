name: Publish module downloads
on:
  push:
    branches: [main]
    paths:
      - module-sources.lock.json
      - sources.lock.json
      - images.lock.env
      - build/package-modules.py
      - build/publish-module-release.py
      - build/modules.Dockerfile
      - tests/modules-contract.mjs
      - tests/modules-pack.py
      - tests/module-releases.py
      - .github/workflows/modules.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: module-downloads-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Download locked public module sources
        run: |
          python3 tests/modules-pack.py
          python3 tests/module-releases.py
          python3 build/package-modules.py prepare
      - id: images
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          lock=json.load(open('sources.lock.json'))
          print('node='+lock['base_images']['node'])
          print('rust='+lock['base_images']['rust'])
          print('api='+dict(line.strip().split('=',1) for line in open('images.lock.env'))['API_IMAGE'])
          PY
      - name: Build and test module binaries
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .build/modules/source
          file: build/modules.Dockerfile
          platforms: linux/amd64
          build-args: |
            NODE_IMAGE=${{ steps.images.outputs.node }}
            RUST_IMAGE=${{ steps.images.outputs.rust }}
          outputs: type=local,dest=.build/modules/compiled
          cache-from: type=gha,scope=modules
          cache-to: type=gha,scope=modules,mode=max
      - name: Create installable archives and download page
        run: python3 build/package-modules.py pack
      - name: Verify real archives offline in the published API runtime
        env:
          API_IMAGE: ${{ steps.images.outputs.api }}
        run: |
          docker pull "$API_IMAGE"
          docker run --rm --network none \
            -v "$PWD/dist/modules-site:/packages:ro" \
            -v "$PWD/tests/modules-contract.mjs:/check.mjs:ro" \
            -v "$PWD/.build/modules/source/cx:/cx-tests:ro" \
            "$API_IMAGE" node /check.mjs
      - name: Archive verified module files in GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 build/publish-module-release.py
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - uses: actions/upload-pages-artifact@5f327015a708106f6f1b7c9a633901af30fe80cb
        with:
          path: dist/modules-site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
