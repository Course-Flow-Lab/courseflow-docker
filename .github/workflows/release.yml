name: Release containers
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Immutable release version (vX.Y.Z)
        required: true
        default: v0.1.3
permissions:
  contents: read
concurrency:
  group: release-containers
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: version
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/build
        with:
          version: ${{ steps.version.outputs.value }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish images and prepare draft release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: python3 build/publish.py "$VERSION"
      - name: Verify anonymous package access
        run: python3 tests/anonymous-pull.py dist/images.lock.env
      - name: Update latest aliases for verified images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: python3 build/promote-latest.py "$VERSION"
      - name: Verify anonymous latest access
        run: python3 tests/anonymous-pull.py dist/images.latest.env
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false
