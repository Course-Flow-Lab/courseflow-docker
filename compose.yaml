services:
  api:
    image: ${API_IMAGE:?Select a release lock file}
    pull_policy: never
    platform: linux/amd64
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    mem_limit: 4g
    shm_size: 512m
    environment:
      CF_BIND: 0.0.0.0:8101
      CF_PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL in .env}
      CF_DATA_DIR: /data
      CF_CHROMIUM: /usr/bin/chromium
      CF_LOG: info
    volumes:
      - type: bind
        source: ${STATE_DIR:?Use scripts/courseflow}/data
        target: /data
        bind:
          create_host_path: false
    security_opt:
      - no-new-privileges:true
      - seccomp=./security/chromium-seccomp.json
    healthcheck:
      test: [CMD, node, --input-type=module, -e, "const r=await fetch('http://127.0.0.1:8101/healthz');const h=await r.json();if(!r.ok||h.status!=='ok'||h.web_api_version!==1)process.exit(1)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  web:
    image: ${WEB_IMAGE:?Select a release lock file}
    pull_policy: never
    platform: linux/amd64
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "127.0.0.1:${WEB_PORT:-8100}:8080"
    depends_on:
      api:
        condition: service_healthy
        restart: true
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/version.json]
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
