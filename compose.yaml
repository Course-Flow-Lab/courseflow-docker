services:
  api:
    image: ${API_IMAGE:-ghcr.io/course-flow-lab/courseflow-api:latest}
    pull_policy: always
    platform: linux/amd64
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    mem_limit: 4g
    shm_size: 512m
    environment:
      CF_BIND: 0.0.0.0:8101
      CF_PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL in .env}
      CF_DATA_DIR: /data
      CF_CHROMIUM: /usr/bin/chromium
      CF_LOG: info
      CF_CAPTCHA_URL: http://captcha:8190
    depends_on:
      captcha:
        condition: service_healthy
        restart: true
    volumes:
      - type: bind
        source: ${STATE_DIR:?Use scripts/courseflow}/data
        target: /data
        bind:
          create_host_path: false
    security_opt:
      - no-new-privileges:true
      - seccomp=./security/chromium-seccomp.json
    healthcheck:
      test: [CMD, node, --input-type=module, -e, "const r=await fetch('http://127.0.0.1:8101/healthz');const h=await r.json();if(!r.ok||h.status!=='ok'||h.web_api_version!==1)process.exit(1)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  captcha:
    image: ${API_IMAGE:-ghcr.io/course-flow-lab/courseflow-api:latest}
    pull_policy: always
    platform: linux/amd64
    init: true
    restart: unless-stopped
    mem_limit: 512m
    command: [/opt/captcha-venv/bin/python, /opt/courseflow-captcha/server.py, --host, 0.0.0.0, --port, '8190']
    environment:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD, /opt/captcha-venv/bin/python, -c, "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8190/health',timeout=3))['status']=='ok'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  web:
    image: ${WEB_IMAGE:-ghcr.io/course-flow-lab/courseflow-webui:latest}
    pull_policy: always
    platform: linux/amd64
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "127.0.0.1:${WEB_PORT:-8100}:8080"
    depends_on:
      api:
        condition: service_healthy
        restart: true
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/version.json]
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
